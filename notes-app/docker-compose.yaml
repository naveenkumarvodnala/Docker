version: '3.9'

services:
  backend: 
    build: .
    container_name: notes-backend
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://admin:Naveenkumar1@mongo:27017/notesdb?authSource=admin
    depends_on:
      - mongo

  mongo:
    image: mongo
    container_name: mongo
    ports:
     - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: Naveenkumar1
    volumes:
      - mongo-data:/data/db
  
  mongo-express:
    image: mongo-express
    container_name: mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: Naveenkumar1
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH: "false"

volumes:
  mongo-data: